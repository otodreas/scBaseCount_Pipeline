[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "scripts/shared",
    "scripts/study_context",
    "scripts/cluster_validation",
    "scripts/metadata",
    "scripts/cyteonto",
    "scripts/h5ad_extractor",
    "scripts/r2",
    "scripts/gcs",
    "scripts/cytetype_runner",
    "scripts/annotation_inspector",
]

[project]
name = "scbasecount-pipeline"
version = "0.1.0"
description = "My 30 hp masters project for Lund University Bioinformatics MSc at Nygen Analytics"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "httpx>=0.28.0",
    "ipykernel>=7.2.0",
    "kneed>=0.8.6",
    "matplotlib>=3.10.8",
    "pydantic>=2.10.0",
    "pyarrow>=23.0.1",
    "scanpy[leiden]>=1.12",
    "python-dotenv>=1.2.2",
    "cytetype>=0.19.4",
    "umap-learn==0.5.11",  # pin: minor updates change embedding layout
    "orjson>=3.11.8",
    "google-cloud-storage>=3.10.1",
    "boto3>=1.43.2",
    "pandas>=2.3.3",
    "xarray>=2026.4.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "nbstripout>=0.7",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
