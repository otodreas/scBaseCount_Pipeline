requires-python = ">=3.11,<3.12"
dependencies = [
    "anndata==0.10.9",
    "cell-gears<0.0.3",
    "datasets>=2.3.0,<3.0",
    "leidenalg>=0.8.10",
    "numba>=0.55.1",
    "numpy<2",
    "orbax<0.1.8",
    "pandas>=1.3.5",
    "scanpy==1.9.3",
    "scgpt",
    "scikit-misc>=0.1.4",
    "scib>=1.0.3,<2.0",
    "scvi-tools==0.20.3",
    "torch==2.1.2",
    "torchtext==0.16.2",
    "typing-extensions>=4.2.0,<5.0",
    "umap-learn>=0.5.3",
]
